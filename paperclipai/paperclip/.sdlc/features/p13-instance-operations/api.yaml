# OpenAPI 3 contract for Instance Operations and Settings.
# Normative API definition referenced by specification.md.
openapi: 3.1.0
info:
  title: "Instance Operations and Settings API"
  version: 1.0.0
  description: >
    This API exposes instance settings, task drain control, Cloud lifecycle readback, manual database backups, and process metrics.
    Request bodies are validated with strict or strip Zod schemas, and deprecated settings keys remain accepted for compatibility.
paths:
  /api/instance/settings:
    get:
      summary: Get combined instance settings
      operationId: getInstanceSettings
      description: Requires board organization access.
      responses:
        "200":
          description: Combined instance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: Update the instance default environment
      operationId: patchInstanceSettings
      description: Requires board access plus local implicit or instance-admin authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInstanceSettings"
      responses:
        "200":
          description: Updated instance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/instance/settings/general:
    get:
      summary: Get general instance settings
      operationId: getInstanceGeneralSettings
      description: Requires board organization access.
      responses:
        "200":
          description: General settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceGeneralSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: Update general instance settings
      operationId: patchInstanceGeneralSettings
      description: Requires board access plus local implicit or instance-admin authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInstanceGeneralSettings"
      responses:
        "200":
          description: Updated general settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceGeneralSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/instance/settings/experimental:
    get:
      summary: Get experimental instance settings
      operationId: getInstanceExperimentalSettings
      description: Requires board organization access. Agents cannot read this surface.
      responses:
        "200":
          description: Experimental settings and optional managed keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceExperimentalSettingsWithManaged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: Update experimental instance settings
      operationId: patchInstanceExperimentalSettings
      description: >
        Requires instance-admin authority or a Cloud tenant board actor with the experimental settings permission.
        Operator-hidden and Cloud-managed restrictions still apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInstanceExperimentalSettings"
      responses:
        "200":
          description: Updated experimental settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceExperimentalSettingsWithManaged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/instance/task-drain:
    get:
      summary: Get task drain status
      operationId: getTaskDrainStatus
      description: >
        Board organization access returns process status.
        upgradeReadiness and idleSleepSafety require instance-admin authority.
        Scheduled wake modes require signed Cloud control authority.
      parameters:
        - $ref: "#/components/parameters/UpgradeReadiness"
        - $ref: "#/components/parameters/IdleSleepSafety"
        - $ref: "#/components/parameters/ScheduledWake"
        - $ref: "#/components/parameters/OwnerId"
        - $ref: "#/components/parameters/IdleSleepDiagnostics"
      responses:
        "200":
          description: Task drain status with optional reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDrainStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Start a task drain
      operationId: startTaskDrain
      description: Requires board access plus local implicit or instance-admin authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTaskDrainRequest"
      responses:
        "200":
          description: Applied drain state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDrainState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Stop a task drain
      operationId: stopTaskDrain
      description: Requires board access plus local implicit or instance-admin authority.
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      responses:
        "200":
          description: Stop result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [wasActive]
                properties:
                  wasActive:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/instance/task-drain/status:
    post:
      summary: Read task drain status with body-bound Cloud authority
      operationId: postTaskDrainStatus
      description: >
        Requires a Cloud control assertion with action task-drain:read-body bound to the exact raw JSON digest.
        This read does not start or stop a drain.
      security:
        - cloudControlAssertion: []
      parameters:
        - $ref: "#/components/parameters/UpgradeReadiness"
        - $ref: "#/components/parameters/IdleSleepSafety"
        - $ref: "#/components/parameters/ScheduledWake"
        - $ref: "#/components/parameters/OwnerId"
        - $ref: "#/components/parameters/IdleSleepDiagnostics"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                idleCapabilities:
                  type: object
                  description: Signed incoming-wake and deadline catalogs validated by Cloud control middleware.
      responses:
        "200":
          description: Task drain status with optional reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDrainStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/instance/lifecycle:
    get:
      summary: Read Cloud primary company lifecycle state
      operationId: getInstanceLifecycle
      description: Requires instance-admin authority. Returns 404 on self-hosted instances.
      responses:
        "200":
          description: Primary company lifecycle summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceLifecycleStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Instance is not Cloud-managed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/instance/lifecycle/unarchive-primary:
    post:
      summary: Restore the Cloud primary company
      operationId: unarchivePrimaryCompany
      description: Requires instance-admin authority and an archived Cloud primary company.
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, changed]
                properties:
                  status:
                    type: string
                  changed:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Instance is not Cloud-managed or the primary company is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/instance/database-backups:
    post:
      summary: Trigger a manual database backup
      operationId: createInstanceDatabaseBackup
      description: Requires instance-admin authority and a self-hosted instance.
      responses:
        "201":
          description: Backup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDatabaseBackupRunResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/instance/server-metrics:
    get:
      summary: Get this server process metrics snapshot
      operationId: getInstanceServerMetrics
      description: >
        Requires instance-admin authority.
        Returns 404 unless the operator enabled PAPERCLIP_SERVER_METRICS.
      responses:
        "200":
          description: Process metrics snapshot
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerMetricsSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Server metrics are disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    cloudControlAssertion:
      type: apiKey
      in: header
      name: x-paperclip-cloud-control
      description: Signed Cloud control JWS bound to one endpoint, method, and action.
  parameters:
    UpgradeReadiness:
      name: upgradeReadiness
      in: query
      required: false
      schema:
        type: string
        const: "1"
      description: Requests an upgrade readiness report for instance operators.
    IdleSleepSafety:
      name: idleSleepSafety
      in: query
      required: false
      schema:
        type: string
        const: "1"
      description: Requests an instance-wide idle safety report.
    ScheduledWake:
      name: scheduledWake
      in: query
      required: false
      schema:
        type: string
        enum: ["1", "2", "domain-deadlines-v1"]
      description: Selects the Cloud scheduled wake catalog.
    OwnerId:
      name: ownerId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Identifies the idle hold owner for inspection or release.
    IdleSleepDiagnostics:
      name: idleSleepDiagnostics
      in: query
      required: false
      schema:
        type: string
        const: "1"
      description: Adds fixed-key diagnostic checks to the idle safety report.
  responses:
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The actor lacks authority for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Another task drain or backup is active, or ownership changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: The request body failed schema validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
    BackupRetentionPolicy:
      type: object
      additionalProperties: false
      required: [dailyDays, weeklyWeeks, monthlyMonths]
      properties:
        dailyDays:
          type: integer
          enum: [3, 7, 14]
        weeklyWeeks:
          type: integer
          enum: [1, 2, 4]
        monthlyMonths:
          type: integer
          enum: [1, 3, 6]
    InstanceGeneralSettings:
      type: object
      additionalProperties: false
      required: [censorUsernameInLogs, feedbackDataSharingPreference, backupRetention]
      properties:
        censorUsernameInLogs:
          type: boolean
        feedbackDataSharingPreference:
          type: string
          enum: [allowed, not_allowed, prompt]
        backupRetention:
          $ref: "#/components/schemas/BackupRetentionPolicy"
        executionMode:
          type: string
          enum: [any, kubernetes]
    PatchInstanceSettings:
      type: object
      additionalProperties: false
      properties:
        defaultEnvironmentId:
          type: [string, "null"]
          format: uuid
    PatchInstanceGeneralSettings:
      type: object
      additionalProperties: false
      properties:
        censorUsernameInLogs:
          type: boolean
        feedbackDataSharingPreference:
          type: string
          enum: [allowed, not_allowed, prompt]
        backupRetention:
