    UpsertCaseDocumentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        format:
          type: string
          minLength: 1
          maxLength: 80
          default: markdown
        body:
          type: string
          maxLength: 200000
        changeSummary:
          type: string
          maxLength: 1000
          nullable: true
        baseRevisionId:
          type: string
          format: uuid
          nullable: true
    HandoffRequest:
      oneOf:
        - $ref: "#/components/schemas/AgentCaseHandoffRequest"
        - $ref: "#/components/schemas/DoneCaseHandoffRequest"
    AgentCaseHandoffRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, case, toAgentId, phase, instructions]
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 240
        case:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id]
              properties:
                id:
                  type: string
                  format: uuid
            - type: object
              additionalProperties: false
              required: [create]
              properties:
                create:
                  type: object
                  additionalProperties: false
                  required: [caseType, title]
                  properties:
                    caseType:
                      type: string
                      maxLength: 120
                    title:
                      type: string
                      maxLength: 500
                    summary:
                      type: string
                      maxLength: 8000
                    fields:
                      type: object
                      additionalProperties: true
                    projectId:
                      type: string
                      format: uuid
                      nullable: true
        toAgentId:
          type: string
          format: uuid
        phase:
          type: string
          minLength: 1
          maxLength: 120
        instructions:
          type: string
          minLength: 1
          maxLength: 20000
        expectedHandoffVersion:
          type: integer
          minimum: 0
        expectedIssueStatusVersion:
          type: integer
          minimum: 0
        bindIssueId:
          type: string
          format: uuid
        initialDocuments:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CaseInitialDocument"
        workflow_document_text:
          type: string
          minLength: 1
          maxLength: 200000
        workflowId:
          type: string
          format: uuid
          nullable: true
    DoneCaseHandoffRequest:
      type: object
      additionalProperties: false
      required: [to, idempotencyKey, case, phase, instructions, expectedHandoffVersion, expectedIssueStatusVersion]
      properties:
        to:
          type: string
          enum: [done]
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 240
        case:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id:
              type: string
              format: uuid
        phase:
          type: string
          enum: [done]
        instructions:
          type: string
          minLength: 1
          maxLength: 20000
        expectedHandoffVersion:
          type: integer
          minimum: 0
        expectedIssueStatusVersion:
          type: integer
          minimum: 0
    CaseInitialDocument:
      type: object
      additionalProperties: false
      required: [key, title, body]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
    CaseHandoffResult:
      type: object
      additionalProperties: true
      required: [handoffId, caseId, taskId, handoffVersion, state, replayed]
      properties:
        handoffId:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        taskIdentifier:
          type: string
        handoffVersion:
          type: integer
        destinationKind:
          type: string
          enum: [agent, done]
        state:
          type: string
          enum: [awaiting_release, pending_dispatch, delivered, awaiting_completion, completed, cancelled]
        completedAt:
          type: string
          format: date-time
          nullable: true
        callerMustYield:
          type: boolean
        replayed:
          type: boolean
    CaseHandoff:
      type: object
      additionalProperties: true
      required: [id, companyId, caseId, issueId, version, state]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        issueId:
          type: string
          format: uuid
        version:
          type: integer
        fromAgentId:
          type: string
          format: uuid
          nullable: true
        destinationKind:
          type: string
          enum: [agent, done]
        toAgentId:
          type: string
          format: uuid
          nullable: true
        phase:
          type: string
        instructions:
          type: string
        actorType:
          type: string
          enum: [agent, user, system]
        actorId:
          type: string
        state:
          type: string
          enum: [awaiting_release, pending_dispatch, delivered, awaiting_completion, completed, cancelled]
        attemptCount:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
