# OpenAPI 3 contract for Skill Sources.
# Normative API definition referenced by specification.md.
# Validate: npx -y @stoplight/spectral-cli lint api.yaml
openapi: 3.1.0
info:
  title: "Skill Sources API"
  version: 0.1.0
  description: >
    Company-scoped GitHub skill source import, discovery, selection, refresh, settings, branch,
    preview, project adoption, and disconnect routes in server/src/routes/company-skills.ts.
    This contract records implemented behavior. Changes require synchronized updates across
    packages/db, packages/shared, server routes, and ui clients.
paths:
  /api/companies/{companyId}/skill-sources:
    get:
      summary: List visible company sources
      operationId: listSkillSources
      parameters:
        - $ref: "#/components/parameters/companyId"
      responses:
        "200":
          description: Visible sources with entries and visible projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillSource"
    post:
      summary: Import a GitHub skill source with selected skill paths
      operationId: createSkillSource
      parameters:
        - $ref: "#/components/parameters/companyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillSourceCreateRequest"
      responses:
        "201":
          description: Imported source and publication result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSourceRefreshResult"
        "409":
          description: Repository and branch already tracked or concurrent change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/companies/{companyId}/skill-sources/project-repositories:
    get:
      summary: List accessible project repositories and skill import status
      operationId: listProjectSkillRepositories
      parameters:
        - $ref: "#/components/parameters/companyId"
      responses:
        "200":
          description: Accessible project repository rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSkillRepository"
  /api/companies/{companyId}/skill-sources/adopt-project:
    post:
      summary: Enqueue import of all skills from a project workspace repository
      operationId: adoptProjectSkillRepository
      parameters:
        - $ref: "#/components/parameters/companyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspaceId]
              properties:
                workspaceId:
                  type: string
                  format: uuid
      responses:
        "202":
          description: Durable binding queued
          content:
            application/json:
              schema:
                type: object
                required: [bindingId]
                properties:
                  bindingId:
                    type: string
                    format: uuid
  /api/companies/{companyId}/skill-sources/repositories:
    get:
      summary: Browse authorized GitHub repositories
      operationId: listGitHubRepositoriesForSkillSources
      parameters:
        - $ref: "#/components/parameters/companyId"
      responses:
        "200":
          description: Tool-access repository list for the current viewer
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /api/companies/{companyId}/skill-sources/discover:
    post:
      summary: Discover and validate repository skills
      operationId: discoverSkillSource
      parameters:
        - $ref: "#/components/parameters/companyId"
        - name: Accept
          in: header
          required: false
          description: Use application/x-ndjson to receive progress and candidate events
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillSourceDiscoveryRequest"
      responses:
        "200":
          description: Audited discovery result, or NDJSON event stream when requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSourceDiscovery"
            application/x-ndjson:
              schema:
                type: object
                additionalProperties: true
                required: [type]
                properties:
                  type:
                    type: string
                    enum: [progress, candidate, complete, error]
        "429":
          description: Scan quota exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/companies/{companyId}/skill-sources/preview:
    post:
      summary: Preview an audited skill package file at an immutable commit
      operationId: previewSkillSourceFile
      parameters:
        - $ref: "#/components/parameters/companyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillSourcePreviewRequest"
      responses:
        "200":
          description: Audited file preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSourceFilePreview"
  /api/companies/{companyId}/skill-sources/{sourceId}:
    get:
      summary: Get a skill source and its entries
      operationId: getSkillSource
      parameters:
        - $ref: "#/components/parameters/companyId"
        - $ref: "#/components/parameters/sourceId"
      responses:
        "200":
          description: Source detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSource"
        "404":
          description: Source not found or not visible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Save skill source selection and connection
      operationId: updateSkillSourceSelection
      parameters:
        - $ref: "#/components/parameters/companyId"
        - $ref: "#/components/parameters/sourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillSourceSelectionRequest"
      responses:
        "200":
          description: Refreshed source and publication result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSourceRefreshResult"
        "409":
          description: Source changed or is refreshing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Disconnect a skill source and retain or delete installed skills
      operationId: disconnectSkillSource
      parameters:
        - $ref: "#/components/parameters/companyId"
        - $ref: "#/components/parameters/sourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillSourceDisconnectRequest"
      responses:
        "200":
          description: Disconnect result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSourceDisconnectResult"
        "409":
          description: Source revision changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/companies/{companyId}/skill-sources/{sourceId}/branches:
    get:
      summary: List authorized repository branches, including the default branch
      operationId: listSkillSourceBranches
      parameters:
        - $ref: "#/components/parameters/companyId"
        - $ref: "#/components/parameters/sourceId"
        - name: connectionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bounded branch list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSourceBranches"
  /api/companies/{companyId}/skill-sources/{sourceId}/settings:
    patch:
      summary: Set automatic updates and authorized refresh connection
      operationId: updateSkillSourceSettings
      parameters:
        - $ref: "#/components/parameters/companyId"
        - $ref: "#/components/parameters/sourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillSourceSettingsRequest"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSource"
        "409":
          description: Settings save lost to a lease or revision change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Selected branch or revision unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/companies/{companyId}/skill-sources/{sourceId}/refresh:
    post:
      summary: Refresh installed source skills
      operationId: refreshSkillSource
      parameters:
        - $ref: "#/components/parameters/companyId"
        - $ref: "#/components/parameters/sourceId"
      responses:
        "200":
          description: Publication result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSourceRefreshResult"
        "409":
          description: Source is refreshing or changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    companyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code:
          type: string
          example: skill_source_scan_limited
        message:
          type: string
    SkillPackageFile:
      type: object
      additionalProperties: true
      required: [path, kind, sizeBytes, encoding, executable]
      properties:
        path:
          type: string
        kind:
          type: string
        sizeBytes:
          type: integer
        encoding:
          type: string
          enum: [utf8, base64]
        executable:
          type: boolean
    SkillPackageInspection:
      type: object
      additionalProperties: true
      required: [files, references, warnings]
      properties:
        commitSha:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/SkillPackageFile"
        requirements:
          type: [string, "null"]
        references:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: string
    SkillSourceEntry:
      type: object
      additionalProperties: true
      required: [id, sourceId, path, name, selection, present]
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        path:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        skillId:
          type: [string, "null"]
          format: uuid
        selection:
          type: string
          enum: [selected, excluded, new]
        present:
          type: boolean
        error:
          type: [string, "null"]
        inspection:
          $ref: "#/components/schemas/SkillPackageInspection"
    SkillSource:
      type: object
      additionalProperties: true
      required: [id, companyId, repositoryUrl, fullName, trackingRef, revision, entries]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        repositoryId:
          type: [string, "null"]
        repositoryUrl:
          type: string
        fullName:
          type: string
        trackingRef:
          type: string
        connectionId:
          type: [string, "null"]
          format: uuid
        packageMode:
          type: string
          enum: [skills, repository]
        excludedFolders:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        automaticUpdates:
          type: boolean
        importNewSkills:
          type: boolean
        accessScope:
          type: string
          enum: [company, projects]
        trackingActive:
          type: boolean
        syncState:
          type: string
          enum: [pending, refreshing, ready, error, paused]
        repairAction:
          type: [string, "null"]
          enum: [connection, branch, retry, null]
        revision:
          type: integer
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        lastError:
          type: [string, "null"]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SkillSourceEntry"
        projects:
          type: array
          items:
            type: object
            additionalProperties: true
    SkillSourceDiscoveryRequest:
      type: object
      additionalProperties: false
      required: [repositoryUrl]
      properties:
        repositoryUrl:
          type: string
          maxLength: 2048
        packageMode:
          type: string
          enum: [skills, repository]
        trackingRef:
          type: string
          minLength: 1
          maxLength: 255
        connectionId:
          type: [string, "null"]
          format: uuid
    SkillSourceCandidate:
      type: object
      additionalProperties: true
      required: [path, name, fileCount, error, warnings]
      properties:
        path:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        fileCount:
          type: integer
        error:
          type: [string, "null"]
        warnings:
          type: array
          items:
            type: string
        inspection:
          $ref: "#/components/schemas/SkillPackageInspection"
    SkillSourceDiscovery:
      type: object
      additionalProperties: true
      required: [repositoryId, repositoryUrl, fullName, trackingRef, commitSha, candidates, warnings]
      properties:
        repositoryId:
          type: string
        repositoryUrl:
          type: string
        fullName:
          type: string
        trackingRef:
          type: string
        commitSha:
          type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/SkillSourceCandidate"
        warnings:
          type: array
          items:
            type: string
        packageMode:
          type: string
          enum: [skills, repository]
        connectionId:
          type: [string, "null"]
          format: uuid
    SkillSourcePreviewRequest:
      allOf:
        - $ref: "#/components/schemas/SkillSourceDiscoveryRequest"
        - type: object
          additionalProperties: false
          required: [commitSha, skillPath, filePath]
          properties:
            commitSha:
              type: string
              pattern: "^[a-f0-9]{40}$"
            skillPath:
              type: string
            filePath:
              type: string
    SkillSourceFilePreview:
      type: object
      additionalProperties: true
      required: [file, commitSha, truncated]
      properties:
        file:
          $ref: "#/components/schemas/SkillPackageFile"
        content:
          type: [string, "null"]
        truncated:
          type: boolean
        commitSha:
          type: string
    SkillSourceCreateRequest:
      allOf:
        - $ref: "#/components/schemas/SkillSourceDiscoveryRequest"
        - type: object
          additionalProperties: false
          required: [commitSha, selectedPaths]
          properties:
            commitSha:
              type: string
              pattern: "^[a-f0-9]{40}$"
            selectedPaths:
              type: array
              maxItems: 10000
              items:
                type: string
            excludedFolders:
              type: array
              maxItems: 10000
              items:
                type: string
    SkillSourceSelectionRequest:
      type: object
      additionalProperties: false
      required: [revision, selectedPaths, excludedFolders]
      properties:
        revision:
          type: integer
          minimum: 0
        packageMode:
          type: string
          enum: [skills, repository]
        selectedPaths:
          type: array
          maxItems: 10000
          items:
            type: string
        excludedFolders:
          type: array
          maxItems: 10000
          items:
            type: string
        connectionId:
          type: [string, "null"]
          format: uuid
    SkillSourceSettingsRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 0
        automaticUpdates:
          type: boolean
        importNewSkills:
          type: boolean
        connectionId:
          type: [string, "null"]
          format: uuid
        trackingRef:
          type: string
          minLength: 1
          maxLength: 255
    SkillSourceRefreshResult:
      type: object
      additionalProperties: true
      required: [source, imported, updated, unchanged, warnings]
      properties:
        source:
          $ref: "#/components/schemas/SkillSource"
        imported:
          type: array
          items:
            type: object
            additionalProperties: true
        updated:
          type: array
          items:
            type: object
            additionalProperties: true
        unchanged:
          type: integer
        warnings:
          type: array
          items:
            type: string
    SkillSourceDisconnectRequest:
      type: object
      additionalProperties: false
      required: [revision, skills]
      properties:
        revision:
          type: integer
          minimum: 0
        skills:
          type: string
          enum: [copy, delete]
    SkillSourceDisconnectResult:
      type: object
      additionalProperties: true
      required: [id, copiedCount, deletedCount]
      properties:
        id:
          type: string
          format: uuid
        copiedCount:
          type: integer
        deletedCount:
          type: integer
    SkillSourceBranches:
      type: object
      additionalProperties: true
      required: [defaultBranch, branches, truncated]
      properties:
        defaultBranch:
          type: string
        branches:
          type: array
          items:
            type: object
            additionalProperties: true
        truncated:
          type: boolean
    ProjectSkillRepository:
      type: object
      additionalProperties: true
      required: [projectId, projectName, workspaceId, repositoryUrl, trackingRef, status]
      properties:
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        projectVisibility:
          type: string
          enum: [open, private]
        workspaceId:
          type: string
          format: uuid
        repositoryUrl:
          type: string
        trackingRef:
          type: string
        bindingId:
          type: [string, "null"]
          format: uuid
        sourceId:
          type: [string, "null"]
          format: uuid
        status:
          type: string
          enum: [available, pending, ready, error]
        importState:
          type: string
          enum: [queued, importing]
        lastError:
          type: [string, "null"]
